name: Sync trends_data.db

on:
  repository_dispatch:
    types: [sync-db] # This listens for the event from the other workflow
  workflow_dispatch: # This allows you to still run it manually

jobs:
  sync-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository (target)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_ALL_REPO }}
          
      - name: Checkout source repository (shallow clone)
        uses: actions/checkout@v4
        with:
          repository: sudoghut/trends-story
          token: ${{ secrets.ACCESS_ALL_REPO }}
          path: source-repo
          fetch-depth: 1
          
      - name: Copy database file from source
        run: cp source-repo/trends_data.db .
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet trends_data.db; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and force push if changed (keep only latest commit)
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          chmod +x trend-story-api
          git checkout --orphan temp-branch
          git add -A
          git commit -m "Sync: Update trends_data.db from trends-story repository"
          git branch -D main
          git branch -m main
          git push --force origin main
